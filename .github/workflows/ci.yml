name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match local bootstrap (Python 3.10+). 3.12 is what preprocessing tests used.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # CPU only. Do not train the CNN in CI.
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
